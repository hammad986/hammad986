# ============================================================
# Profile Metrics — GitHub Actions workflow
#
# What it does:
#   Generates stable GitHub statistics + top-languages SVGs using
#   lowlighter/metrics and commits them to the ROOT of the `main`
#   branch, where README.md embeds them via relative paths:
#     ./metrics.svg
#     ./metrics.plugin.languages.svg
#
# SETUP (one time, required):
#   1. Create a Personal Access Token (classic) with "public repo"
#      (read) scope: https://github.com/settings/tokens
#   2. Add it as a repository secret named METRICS_TOKEN:
#      Settings -> Secrets and variables -> Actions -> New secret
#   3. Manually run this workflow once from the Actions tab.
#   4. Verify metrics.svg / metrics.plugin.languages.svg appear in
#      the repo root before relying on them in the README.
#
# Notes:
#   - GITHUB_TOKEN alone is NOT sufficient for lowlighter/metrics;
#     a PAT stored as METRICS_TOKEN is required.
#   - Runs daily at 01:20 UTC and on every push to main.
# ============================================================

name: Generate Profile Metrics

on:
  schedule:
    - cron: "20 1 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Overall profile statistics card (header/activity/community/repos)
      - name: General metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hammad986
          filename: metrics.svg
          committer_branch: main
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata

      # Top languages card, generated as a separate committed asset
      - name: Languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hammad986
          filename: metrics.plugin.languages.svg
          committer_branch: main
          config_timezone: Asia/Kolkata
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_colors: github
