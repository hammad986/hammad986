name: Generate Contribution Snake

on:
  # Runs automatically once a day to keep the animation fresh
  schedule:
    - cron: "0 0 * * *"
  # Also runs on every push to main, so it works immediately after setup
  push:
    branches:
      - main
  # Allows manual trigger from the Actions tab ("Run workflow" button)
  workflow_dispatch:

permissions:
  contents: write # required to push generated SVGs to the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates the snake SVGs from the contribution grid.
      # Outputs are written to ./dist (configured below) and pushed to the `output` branch.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#161B22,#1F2937,#6D28D9,#8B5CF6,#A78BFA
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#0D1117,#21262D,#4C2889,#8957E5,#A371F7

      # Publishes the generated SVGs to the `output` branch of this repo,
      # keeping history clean (force-pushes a single commit each run).
      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
